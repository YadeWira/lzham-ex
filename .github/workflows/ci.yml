name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            compiler: gcc
            packages: ""
            processor: x86_64
          - arch: x86
            compiler: gcc
            packages: gcc-multilib g++-multilib
            processor: i686
            flags: -m32
          - arch: x64
            compiler: clang
            packages: ""
            processor: x86_64
          - arch: arm64
            compiler: gcc
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user
            processor: aarch64
            cross: aarch64-linux-gnu
            emulator: "qemu-aarch64;-L;/usr/aarch64-linux-gnu"
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Configure
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release)
          # The emulator value contains semicolons, so every argument is kept in an array element
          # and passed quoted: letting the shell split it turns "-L" into a command.
          if [ -n "${{ matrix.flags }}" ]; then
            args+=("-DCMAKE_C_FLAGS=${{ matrix.flags }}" "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}")
          fi
          if [ -n "${{ matrix.cross }}" ]; then
            args+=(
              -DCMAKE_SYSTEM_NAME=Linux
              "-DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }}"
              "-DCMAKE_C_COMPILER=${{ matrix.cross }}-gcc"
              "-DCMAKE_CXX_COMPILER=${{ matrix.cross }}-g++"
            )
          fi
          if [ -n "${{ matrix.emulator }}" ]; then
            args+=("-DCMAKE_CROSSCOMPILING_EMULATOR=${{ matrix.emulator }}")
          fi
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            args+=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++)
          fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Only the native x64 GCC build installs and consumes the package.
      - name: Install
        if: matrix.arch == 'x64' && matrix.compiler == 'gcc'
        run: |
          cmake -S . -B build-pkg -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build-pkg --parallel
          cmake --install build-pkg

      - name: Consume installed package (CMake)
        if: matrix.arch == 'x64' && matrix.compiler == 'gcc'
        run: |
          cmake -S tests/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build build-consumer --parallel
          export LD_LIBRARY_PATH="$(dirname "$(find "$PWD/prefix" -name 'liblzhamdll.so' | head -1)")"
          ./build-consumer/lzham_consumer
          ./build-consumer/lzham_consumer_static

      - name: Consume installed package (pkg-config)
        if: matrix.arch == 'x64' && matrix.compiler == 'gcc'
        run: |
          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$(dirname "$(find "$PWD/prefix" -name 'liblzhamdll.so' | head -1)")"
          cc tests/consumer/main.c -o pc_consumer $(pkg-config --cflags --libs lzham)
          ./pc_consumer

  windows:
    name: Windows ${{ matrix.arch }} (MSVC)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, Win32 ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check DLL exports
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter "lzham_x*.dll" build | Select-Object -First 1
          if (-not $dll) { throw "DLL not found" }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path (Join-Path $vsPath "VC\Tools\MSVC") -Recurse -Filter dumpbin.exe |
                     Where-Object { $_.FullName -like "*Hostx64\x64*" } | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found" }
          $exports = & $dumpbin.FullName /nologo /exports $dll.FullName
          foreach ($sym in @("lzham_get_version", "lzham_compress_init", "lzham_decompress", "lzham_z_compress")) {
            if (-not ($exports -match $sym)) { throw "Missing export: $sym" }
          }
          Write-Host "Exports OK: $($dll.Name)"

      - name: Run the CLI against the DLL
        shell: pwsh
        run: |
          $dir = (Get-ChildItem -Recurse -Filter "lzhamtest.exe" build | Select-Object -First 1).DirectoryName
          $input = Join-Path $PWD "ci_input.bin"
          $bytes = New-Object byte[] 200000
          for ($i = 0; $i -lt $bytes.Length; $i++) { $bytes[$i] = ($i * 7 + ($i -shr 8)) -band 0xFF }
          [System.IO.File]::WriteAllBytes($input, $bytes)
          & "$dir\lzhamtest.exe" c $input "$PWD\ci_compressed.lzham"
          if ($LASTEXITCODE -ne 0) { throw "compression failed" }
          & "$dir\lzhamtest.exe" d "$PWD\ci_compressed.lzham" "$PWD\ci_roundtrip.bin"
          if ($LASTEXITCODE -ne 0) { throw "decompression failed" }
          if ((Get-FileHash $input).Hash -ne (Get-FileHash "$PWD\ci_roundtrip.bin").Hash) { throw "roundtrip mismatch" }
          Write-Host "lzhamtest roundtrip OK"

  macos:
    name: macOS ${{ matrix.name }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            archs: arm64
            target: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.archs }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.target }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-xp:
    name: Windows XP x86 (MinGW cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 (i686)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686

      - name: Configure
        run: |
          cmake -S . -B build-xp -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DLZHAM_TARGET_WINDOWS_XP=ON

      - name: Build
        run: cmake --build build-xp --parallel

      # GitHub's runners cannot execute Windows XP, so the runtime check lives on a local XP VM. Here we
      # assert the two properties XP requires: a subsystem version it can load, and imports that only name
      # DLLs and functions XP ships.
      - name: Check the binaries are XP-loadable
        run: |
          set -e
          for f in build-xp/bin/Release/*.exe build-xp/bin/Release/*.dll; do
            echo "== $f"
            major=$(i686-w64-mingw32-objdump -p "$f" | awk '/MajorSubsystemVersion/{print $2; exit}')
            minor=$(i686-w64-mingw32-objdump -p "$f" | awk '/MinorSubsystemVersion/{print $2; exit}')
            echo "   subsystem $major.$minor"
            test "$major" -lt 5 -o \( "$major" -eq 5 -a "$minor" -le 1 \)
            dlls=$(i686-w64-mingw32-objdump -p "$f" \
                   | sed -n 's/.*\(DLL Name\|Nombre DLL\)[[:space:]]*:[[:space:]]*//p' \
                   | sort -u)
            echo "   imports: $(echo $dlls)"
            for dll in $dlls; do
              case "$dll" in
                KERNEL32.dll|msvcrt.dll|lzham_x86.dll) ;;
                *) echo "   unexpected import: $dll"; exit 1 ;;
              esac
            done
          done
          echo "All binaries are XP-loadable."
